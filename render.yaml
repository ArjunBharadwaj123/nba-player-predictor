# Render Blueprint for the multi-sport (NBA + NFL) Player Predictor backend.
# One FastAPI app (api.main:app) serves the NBA endpoints at the root and mounts
# the NFL router under /nfl. NFL models load lazily by position, so startup stays
# light. Deploy: push to GitHub, then Render → New → Blueprint, pick this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nba-player-predictor-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Optional: shared Odds API key for NBA + NFL live lines (works without it).
      - key: ODDS_API_KEY
        sync: false
      # Admin dashboard password (protects /admin/*). Set the real value in the
      # Render dashboard — never committed.
      - key: ADMIN_PASSWORD
        sync: false
